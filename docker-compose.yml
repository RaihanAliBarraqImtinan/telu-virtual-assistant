version: '3.8'

services:
  app:
    build: .
    container_name: telu_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - telu-network

  webserver:
    image: nginx:alpine
    container_name: telu_webserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - telu-network

networks:
  telu-network:
    driver: bridge