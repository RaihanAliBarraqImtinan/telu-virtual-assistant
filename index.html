<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tel-U Virtual Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { width: 100%; max-width: 450px; height: 600px; background: #fff; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #b91c1c; color: white; padding: 18px; font-weight: bold; font-size: 1.1rem; text-align: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.bot { background: #f1f3f5; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message.user { background: #dbeafe; color: #1e40af; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.error { background: #fee2e2; color: #991b1b; align-self: flex-start; }
        .chat-input { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: #fff; }
        .chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .chat-input button { background: #b91c1c; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Tel-U Virtual Assistant 🤖</div>
        <div id="chat-box" class="chat-box">
            <div class="message bot">Halo! Ada yang bisa saya bantu terkait informasi kampus Telkom University?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Tanyakan sesuatu..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    appendMessage('bot', data.reply);
                } else {
                    appendMessage('error', 'Gagal: ' + data.message);
                }
            } catch (err) {
                appendMessage('error', 'Gagal terhubung ke server.');
            }
        }

        function appendMessage(sender, text) {
            const box = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
